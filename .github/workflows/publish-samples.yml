name: Publish contact sheets to a branch
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run whose artifacts to publish"
        required: true
      branch:
        default: "marks-samples"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: sheets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sheets
          git init -q -b "${{ github.event.inputs.branch }}"
          git config user.name "intake-review"; git config user.email "intake-review@users.noreply.github.com"
          git add -A && git commit -qm "sheets from run ${{ github.event.inputs.run_id }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "${{ github.event.inputs.branch }}"
