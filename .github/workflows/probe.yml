name: Probe museum APIs (read-only)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow imagehash numpy opencv-python-headless && python tools/probe.py
        env:
          NEVERLAND_READ: ${{ secrets.NEVERLAND_READ }}
