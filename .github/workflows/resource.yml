name: Re-source unfit catalog copies

# Tobi, 17 Nov 2026: find a better copy of every unfit catalog image instead of hiding it.
# Daily; a few hundred targets per run; picks up where it stopped (state in Drive).
on:
  push:            # first upload (or any change to the job) = a 20-target test run
    branches: [main]
    paths: [.github/workflows/resource.yml, resource_job.py]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "How many unfit copies to look up this run"
        default: "300"
      dry_run:
        description: "1 = search and check only, save nothing"
        default: "0"

permissions:
  contents: write

concurrency:
  group: resource
  cancel-in-progress: false

jobs:
  resource:
    if: vars.PAUSED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q open_clip_torch numpy pillow imagehash requests opencv-python-headless
      - name: Look up better copies (store and catalog folders are not changed)
        env:
          GOOGLE_AUTH: ${{ secrets.GOOGLE_AUTH }}
          NEVERLAND_READ: ${{ secrets.NEVERLAND_READ }}
          TARGETS: ${{ github.event.inputs.targets || (github.event_name == 'push' && '20' || '300') }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FLOOR_GB: ${{ vars.FLOOR_GB || '150' }}
          RUN_MINUTES: "320"
        run: python resource_job.py
      - name: Save the list of misses (re-tried later)
        if: always() && github.event.inputs.dry_run != '1'
        run: |
          git config user.name "intake-resource"; git config user.email "intake-resource@users.noreply.github.com"
          if [ -n "$(git status --porcelain resource_misses.jsonl)" ]; then
            git add resource_misses.jsonl
            git commit -qm "Re-source misses $(date -u +%F)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
