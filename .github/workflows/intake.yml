name: Museum intake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; each run picks up where the last stopped
  push:
    branches: [main]
    paths: [run-now.txt]   # changing this file starts a run right away
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many images (0 = no limit)"
        default: "0"
      sources:
        description: "(unused: each museum runs as its own part)"
        default: ""
      upgrade:
        description: "One-off: replace the capped 4096px test files (1 = yes)"
        default: "0"

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  intake:
    if: vars.PAUSED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: museum-intake-${{ matrix.part }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        part: [artvee, gap, wikidata, europeana, ycba, aic]   # 21 Nov (Tobi: fill the free ~3 TB, paintings first): aic back (fixed: fixed 3000px size, see src_aic); si and rijks dropped (0 new in 24 h, exhausted); gap (20 Nov): Google Art Project paintings on Commons; fng, wellcome, smk, nga, met, cleveland finished; aic dropped 18 Nov (blocks GitHub; run it from Render or the Mac)
        shard: [0, 1, 2]                   # 16 Nov 2026: each source in 3 parts at once
        include:                           # 21 Nov: Wikidata (~371k public-domain paintings, most famous first) is the biggest painting pool: 6 parts
          - {part: wikidata, shard: 3}
          - {part: wikidata, shard: 4}
          - {part: wikidata, shard: 5}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow imagehash requests numpy opencv-python-headless
      # 20 Nov 2026: one catalog fingerprint list per hour, shared through the GitHub cache, instead of every
      # part downloading ~600K rows from the busy database when it starts (catalog.py index_rows)
      - run: echo "HOUR=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"
      - id: idx
        uses: actions/cache/restore@v4
        with:
          path: catalog_index.json.gz
          key: catalog-index-${{ env.HOUR }}
          restore-keys: catalog-index-
      - name: Refresh the shared catalog list (once an hour)
        if: steps.idx.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          NEVERLAND_READ: ${{ secrets.NEVERLAND_READ }}
        run: python -c "import catalog; catalog.dump_index()"
      - if: steps.idx.outputs.cache-hit != 'true' && hashFiles('catalog_index.json.gz') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: catalog_index.json.gz
          key: catalog-index-${{ env.HOUR }}
      - name: Download museum art into Google Drive
        env:
          GOOGLE_AUTH: ${{ secrets.GOOGLE_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEVERLAND_READ: ${{ secrets.NEVERLAND_READ }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          SOURCES: ${{ matrix.part }}
          STATE_FILE: state-${{ matrix.part }}-${{ matrix.shard }}.json
          PARENT_STATE: state-${{ matrix.part }}.json
          SHARD_N: ${{ matrix.part == 'wikidata' && '6' || '3' }}
          SHARD_I: ${{ matrix.shard }}
          WORKERS: "10"
          FLOOR_GB: ${{ vars.FLOOR_GB || '150' }}
          RUN_MINUTES: "330"
          UPGRADE: ${{ github.event.inputs.upgrade || '0' }}
        run: python intake.py
      - name: Start the next run (only if this one stopped because its time ran out)
        if: always() && hashFiles('again') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run intake.yml --ref main
