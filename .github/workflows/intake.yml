name: Museum intake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; each run picks up where the last stopped
  push:
    branches: [main]
    paths: [run-now.txt]   # changing this file starts a run right away
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many images (0 = no limit)"
        default: "0"
      sources:
        description: "(unused: each museum runs as its own part)"
        default: ""
      upgrade:
        description: "One-off: replace the capped 4096px test files (1 = yes)"
        default: "0"

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  intake:
    if: vars.PAUSED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: museum-intake-${{ matrix.part }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        part: [rijks, smk, nga, met, cleveland, aic]   # museums download side by side (Rijksmuseum, SMK added 17 Nov)
        shard: [0, 1, 2]                   # 16 Nov 2026: each museum in 3 parts at once (12 jobs)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow imagehash requests numpy opencv-python-headless
      - name: Download museum art into Google Drive
        env:
          GOOGLE_AUTH: ${{ secrets.GOOGLE_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEVERLAND_READ: ${{ secrets.NEVERLAND_READ }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          SOURCES: ${{ matrix.part }}
          STATE_FILE: state-${{ matrix.part }}-${{ matrix.shard }}.json
          PARENT_STATE: state-${{ matrix.part }}.json
          SHARD_N: "3"
          SHARD_I: ${{ matrix.shard }}
          WORKERS: "10"
          FLOOR_GB: ${{ vars.FLOOR_GB || '150' }}
          RUN_MINUTES: "330"
          UPGRADE: ${{ github.event.inputs.upgrade || '0' }}
        run: python intake.py
      - name: Start the next run (only if this one stopped because its time ran out)
        if: always() && hashFiles('again') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run intake.yml --ref main
